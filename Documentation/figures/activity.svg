<svg xmlns="http://www.w3.org/2000/svg" width="780" height="700" viewBox="0 0 780 700"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="300" cy="28" r="10" fill="#1a2238"/><line x1="300" y1="38" x2="300" y2="70" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="70" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="93" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="93">Admin selects program, term, exam year</tspan></text><line x1="300" y1="116" x2="300" y2="148" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="148" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="171" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="163.1875">Load cohort (students with a regular attempt</tspan><tspan x="300" y="178.8125">in that exam year) and all later sittings</tspan></text><line x1="300" y1="194" x2="300" y2="226" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="226" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="249" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="241.1875">Pick effective attempt per subject</tspan><tspan x="300" y="256.8125">(first pass, otherwise latest)</tspan></text><line x1="300" y1="272" x2="300" y2="304" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="304" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="327" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="327">Compute subject percent, grade, points</tspan></text><line x1="300" y1="350" x2="300" y2="384" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><polygon points="300,384 410,414 300,444 190,414" fill="#fff" stroke="#1F3D78" stroke-width="1.5"/><text x="300" y="414" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="406.5">All subjects</tspan><tspan x="300" y="421.5">passed?</tspan></text><line x1="410" y1="414" x2="540" y2="414" stroke="#44506a" stroke-width="1.4"  /><text x="580" y="414" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="580" y="414">No</tspan></text><polyline points="540,414 540,470" fill="none" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="450" y="470" width="180" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="540" y="493" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="540" y="485.5">Status = fail</tspan><tspan x="540" y="500.5">(reappear needed)</tspan></text><text x="175" y="400" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="175" y="400">Yes</tspan></text><line x1="300" y1="444" x2="300" y2="480" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="480" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="503" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="503">Status = pass, compute SGPA and division</tspan></text><polyline points="540,516 540,560 300,560" fill="none" stroke="#44506a" stroke-width="1.4"  /><line x1="300" y1="526" x2="300" y2="570" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="570" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="593" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="593">Rank cohort (merge sort, ties share rank)</tspan></text><line x1="300" y1="616" x2="300" y2="646" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="175" y="646" width="250" height="46" rx="18" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="300" y="669" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="300" y="661.5">Save results; publish if admin chooses;</tspan><tspan x="300" y="676.5">queue emails</tspan></text></svg>