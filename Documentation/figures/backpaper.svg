<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#44506a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="10" y="40" width="160" height="60" rx="26" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="90" y="70" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="90" y="62.1875">Regular sitting</tspan><tspan x="90" y="77.8125">(attempt 1)</tspan></text><rect x="210" y="40" width="160" height="60" rx="26" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="290" y="70" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="290" y="62.1875">Failed subject</tspan><tspan x="290" y="77.8125">becomes a backlog</tspan></text><rect x="410" y="40" width="160" height="60" rx="26" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="490" y="70" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="490" y="62.1875">Back paper entered</tspan><tspan x="490" y="77.8125">(attempt 2, 3 ...)</tspan></text><rect x="620" y="40" width="160" height="60" rx="26" fill="#EEF2FA" stroke="#1F3D78" stroke-width="1.5" /><text x="700" y="70" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12.5" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="700" y="62.1875">Effective attempt</tspan><tspan x="700" y="77.8125">chosen</tspan></text><line x1="170" y1="70" x2="210" y2="70" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><line x1="370" y1="70" x2="410" y2="70" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><line x1="570" y1="70" x2="620" y2="70" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><polygon points="700,155 800,190 700,225 600,190" fill="#fff" stroke="#1F3D78" stroke-width="1.5"/><text x="700" y="190" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="700" y="182.5">Back paper</tspan><tspan x="700" y="197.5">passed?</tspan></text><line x1="700" y1="100" x2="700" y2="155" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><rect x="530" y="240" width="190" height="60" rx="6" fill="#E8F3EC" stroke="#2f7a4f" stroke-width="1.5" /><text x="625" y="270" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="625" y="262.5">Cleared: semester GPA and</tspan><tspan x="625" y="277.5">CGPA recalculated</tspan></text><rect x="735" y="240" width="140" height="60" rx="6" fill="#FBEAEA" stroke="#B3392F" stroke-width="1.5" /><text x="805" y="270" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="805" y="262.5">Still a backlog:</tspan><tspan x="805" y="277.5">re-sit later</tspan></text><line x1="660" y1="215" x2="625" y2="240" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><text x="620" y="222" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="620" y="222">Yes</tspan></text><line x1="740" y1="215" x2="790" y2="240" stroke="#44506a" stroke-width="1.4"  marker-end="url(#arr)"/><text x="782" y="222" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="12" fill="#1a2238" font-weight="400" font-style="normal"><tspan x="782" y